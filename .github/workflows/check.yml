name: build and check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No install step — the core has no dependencies, by design.
      - name: Build every example
        run: node scripts/build-all.mjs

      # PowerShell's `Get-Content | Set-Content -Encoding utf8` silently
      # double-encodes UTF-8 and adds a BOM. It shipped mojibake into the skill
      # bundle once already. Cheap to check, invisible otherwise.
      # check-encoding:allow-samples
      - name: Check encoding
        run: node scripts/check-encoding.cjs

      - name: Validate and drift-check
        run: node scripts/check-all.mjs

      # The built artifacts are committed so GitHub Pages can serve them.
      # If a source change was pushed without rebuilding, dist/ drifts from
      # src/ and the published examples silently stop matching the library.
      - name: Fail if dist/ is stale
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist/
            exit 1
          fi

      - name: Confirm artifacts are self-contained
        run: |
          fail=0
          for f in dist/*.html; do
            if grep -qE '<script[^>]+src="https?:|<link[^>]+href="https?:' "$f"; then
              echo "::error file=$f::references a remote asset — artifacts must work offline"; fail=1
            fi
            if grep -q 'type="module"' "$f"; then
              echo "::error file=$f::contains a module script — CORS-blocked at file://"; fail=1
            fi
          done
          exit $fail

      # The skill is published at both paths on purpose: Claude Code reads
      # .claude/skills/, while Copilot, Cursor and Codex read .agents/skills/.
      # They are real files rather than a symlink, because a symlink degrades to
      # a text stub when cloned on Windows. Real files can drift, so check them.
      - name: Confirm the two skill paths are identical
        run: |
          if ! diff -r .agents/skills/artifactkit .claude/skills/artifactkit; then
            echo "::error::.agents/skills and .claude/skills have diverged. Re-sync them."
            exit 1
          fi

      # assets/ inside the skill is a copy of src/ with relative paths rewritten,
      # so the skill works standalone in a sandbox with no repo checkout.
      - name: Confirm the skill bundle matches src/
        run: |
          fail=0
          for f in theme.css components.css print.css core.js; do
            if ! diff -q "src/$f" ".agents/skills/artifactkit/assets/$f" >/dev/null; then
              echo "::error::src/$f differs from the skill bundle. Re-sync it."; fail=1
            fi
          done
          exit $fail
